<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Settings</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1 id="title">Settings</h1>
  <section id="intro" class="intro"></section>
  <p>Settings belong to this extension only. The API key is kept for this Thunderbird session and never written to disk.</p>
  <form id="settings">
    <label>Responses endpoint <input id="endpoint" type="url" required autocomplete="off" spellcheck="false"></label>
    <label>Model <input id="model" required autocomplete="off" spellcheck="false"></label>
    <label>API key (session only; empty clears it) <input id="api-key" type="password" autocomplete="off" spellcheck="false"></label>
    <button type="submit">Grant endpoint access and save</button>
  </form>
  <p id="status" role="status"></p>
  <p id="error" role="alert"></p>
</main>
<script type="module" src="options.js"></script>
</body>
</html>
